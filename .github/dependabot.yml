# Weekly dependency update pull requests. Each one runs CI like any other pull request.
# Updates are grouped so each week brings at most one pull request per ecosystem:
# without groups, Dependabot opens a separate pull request for every package in every
# requirements file, and the backend lists the same packages in several folders.
version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      desktop:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: pip
    directories:
      - /backend/scripts
      - /backend/projects/*
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
