name: Desktop installers

# Builds the Windows installer and the macOS disk images. macOS builds need a Mac, so they run on
# GitHub's macOS runners. Start it from the Actions tab, or push a tag such as v0.2.0.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win -- --publish never # the release job publishes
      - uses: actions/upload-artifact@v7
        with:
          name: pockpock-agent-windows
          path: desktop/release/*.exe
          if-no-files-found: error

  macos:
    name: macOS disk images (Apple silicon and Intel)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # npm installs only this runner's (arm64) terminal binary; the Intel build needs its own too.
      - name: Add the Intel terminal binary
        run: |
          version=$(node -p "require('./node_modules/@lydell/node-pty/package.json').version")
          npm install --no-save --force "@lydell/node-pty-darwin-x64@${version}"
      - run: npm run typecheck
      - run: npm run dist:mac -- --publish never # the release job publishes
      - name: Check the app bundle is signed (ad hoc)
        run: codesign --verify --deep --strict --verbose=2 "release/mac-arm64/PockPock Agent.app"
      - uses: actions/upload-artifact@v7
        with:
          name: pockpock-agent-macos
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

  release:
    # Only for version tags: publishes the installers on the Releases page. Each file is attached
    # under its versioned name and under a fixed name, so links to
    # releases/latest/download/PockPock-Agent-Setup.exe always fetch the newest version.
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match desktop/package.json version ${version}." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Add fixed-name copies
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "PockPock-Agent-Setup-${version}.exe" PockPock-Agent-Setup.exe
          cp "PockPock-Agent-${version}-mac-arm64.dmg" PockPock-Agent-mac-arm64.dmg
          cp "PockPock-Agent-${version}-mac-x64.dmg" PockPock-Agent-mac-x64.dmg
          ls -la
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "${GITHUB_REF_NAME}" dist/*.exe dist/*.dmg dist/*.zip \
            --title "PockPock Agent ${GITHUB_REF_NAME#v}" --verify-tag "$@"
