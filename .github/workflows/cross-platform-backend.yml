name: Cross-platform backend checks

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/projects/**"
      - "backend/scripts/**"
      - "desktop/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/cross-platform-backend.yml"
  pull_request:
    paths:
      - "backend/projects/**"
      - "backend/scripts/**"
      - "desktop/**"
      - "README.md"
      - "docs/**"
      - ".github/workflows/cross-platform-backend.yml"

jobs:
  backend:
    name: Python backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python backend/scripts/pockpock.py setup
      - if: runner.os == 'Linux'
        run: sudo .venv/bin/python -m playwright install-deps chromium
      - run: .venv/bin/python backend/scripts/run_tests.py
        if: runner.os != 'Windows'
      - run: .venv\Scripts\python.exe backend\scriptsun_tests.py
        if: runner.os == 'Windows'
      - run: python backend/scripts/pockpock.py check

  desktop:
    name: Desktop app (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
