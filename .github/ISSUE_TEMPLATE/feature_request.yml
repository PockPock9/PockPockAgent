name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and why the current behaviour falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      description: PockPock agents act on the user's computer.
      options:
        - label: This keeps the existing approval and permission model (or the proposal explains how it changes it).
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this.
