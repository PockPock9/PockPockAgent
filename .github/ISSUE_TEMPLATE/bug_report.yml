name: Bug report
description: Something does not work as described.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, use **Security → Report a vulnerability** instead of this form.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open PockPock Agent
        2. Choose PockPock Agent mode
        3. Send "…"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Setup / installer
        - Services
        - Chat / Smart Router
        - PockPock Agent
        - OpenClaw
        - NemoClaw
        - Skills / MCP servers
        - Browser recipes
        - Interface
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (backend only)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PockPock version or commit
      placeholder: v0.1.0, or a commit hash when running from source
  - type: input
    id: hardware
    attributes:
      label: Hardware
      placeholder: 32 GB RAM, RTX 4070 12 GB / M2 16 GB
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: From Services → the service → log, or Setup → Show details. Remove anything private first.
      render: text
